<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezepte-Sammlung</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<h1>🍳 Meine Rezepte</h1>

<form class="add" id="addForm">
  <input type="url" id="urlInput" placeholder="TikTok-Link (oder YouTube, Instagram, anderer Link) einfügen" required>
  <select id="tabSelect"></select>
  <button class="primary" type="submit" id="addBtn">Hinzufügen</button>
</form>

<div class="tabs" id="tabs"></div>

<input type="text" id="searchInput" class="search" placeholder="Suchen…" autocomplete="off" enterkeyhint="search">
<div class="tabtools" id="tabtools"></div>
<div id="list"></div>

<div id="toast"></div>

<script src="script.js?v=3"></script>
</body>
</html>
